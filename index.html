<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>同座 — Doza</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --fg: #d0d7de;
  --muted: #5a6370;
  --dim: #3a4048;
  --warm: #ffc470;
  --amber: #ff9c3d;
  --card-bg: linear-gradient(180deg, rgba(255,255,255,0.025) 0%, rgba(255,255,255,0.008) 100%);
  --card-border: 1px solid rgba(255,255,255,0.06);
  --fd: 'Shippori Mincho', serif;
  --fb: 'Noto Sans JP', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--fb);
  overflow-x: hidden; overflow-y: auto;
}

/* Layout */
.app { display: flex; flex-direction: column; min-height: 100vh; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; max-width: 500px; margin-inline: auto; width: 100%;}
.clock { color: #6e7a88; font-size: 13px; font-family: var(--fb); font-variant-numeric: tabular-nums; }
.nav { display: flex; gap: 2px; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 2px; }
.nav-btn {
  padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;
  font-family: var(--fd); letter-spacing: 0.06em; background: transparent; color: var(--muted); transition: all 0.2s;
}
.nav-btn.active { background: rgba(255,176,80,0.12); color: var(--warm); }
.main {
  flex: 1;
  padding: 10px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: auto;
  max-width: 500px; 
  margin-inline: auto; 
  width: 100%;
}
.footer { text-align: center; padding: 4px 16px 14px; color: #1e252e; font-size: 11px; font-family: var(--fd); }

/* Card */
.card {
  background: var(--card-bg); border: var(--card-border);
  border-radius: 12px; padding: 16px;
}

/* Timer grid */
.timer-grid {
  display: grid;
  grid-template-rows: 110px 90px 100px 44px 20px auto;
  gap: 10px; flex: 1; min-height: 0; align-content: start;
}

/* Counter */
.counter-panel { text-align: center; padding: 24px 16px; height: 110px; display: flex; flex-direction: column; justify-content: center; }
.counter {
  font-size: 3.2rem; font-variant-numeric: tabular-nums; font-family: var(--fb);
  font-weight: 300; letter-spacing: 0.04em; line-height: 1;
  color: var(--dim); transition: color 0.5s, text-shadow 0.5s;
}
.counter.running { color: #ffd9a0; text-shadow: 0 0 20px rgba(255,176,80,0.15); }
.counter.paused { color: #6e7a88; }
.remain-row { margin-top: 8px; font-size: 12px; height: 18px; color: var(--muted); }
.remain-row.urgent { color: var(--amber); }

/* Task panel */
.task-panel { height: 90px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.task-tags { display: flex; flex-wrap: wrap; gap: 4px; overflow: auto; max-height: 46px; margin-bottom: 6px; }
.task-tag {
  padding: 4px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px;
  font-family: var(--fb); background: rgba(255,255,255,0.04); color: #8a94a0; transition: all 0.15s;
}
.task-tag:hover { background: rgba(255,176,80,0.10); color: var(--warm); }
.task-tag-del { background: none; border: none; color: #2a3038; cursor: pointer; font-size: 11px; padding: 0 3px; }
.task-input {
  width: 100%; padding: 6px 10px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
  color: var(--fg); font-size: 12px; font-family: var(--fb); outline: none;
}
.task-running { display: flex; align-items: center; gap: 10px; height: 100%; }
.task-running .label { font-size: 12px; color: var(--muted); font-family: var(--fd); }
.task-running .name { font-size: 14px; color: var(--fg); }
.task-running .time { margin-left: auto; font-size: 11px; color: #4a5360; }

/* Message */
.msg-panel { height: 100px; display: flex; align-items: flex-start; gap: 10px; overflow: hidden; position: relative; }
.msg-text { font-size: 14px; line-height: 1.75; color: #c8b88a; font-family: var(--fd); flex: 1; padding-top: 8px; overflow: hidden; }
.msg-cursor { opacity: 0.5; animation: blink 0.8s step-end infinite; }
.msg-fade { position: absolute; bottom: 0; left: 0; right: 0; height: 18px; background: linear-gradient(transparent, rgba(13,17,23,0.8)); pointer-events: none; }
@keyframes blink { 50% { opacity: 0; } }

/* Ember */
.ember-wrap { position: relative; width: 56px; min-height: 80px; flex-shrink: 0; }
.spark {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle, #ffd39b, #ff9c3d 70%, transparent 71%);
  opacity: 0; filter: blur(0.5px);
}
.ember-outer {
  position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,176,80,0.10) 0%, rgba(255,140,50,0.03) 50%, transparent 72%);
  animation: ember-breathe 4s ease-in-out infinite; transition: all 0.8s;
}
.ember-mid {
  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,210,160,0.25) 0%, rgba(255,160,80,0.08) 60%, transparent 100%);
  filter: blur(4px); transition: all 0.8s; animation: ember-pulse 3s ease-in-out infinite;
}
.ember-core {
  position: absolute; left: 50%; bottom: 30px; transform: translate(-50%, 0);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: radial-gradient(ellipse at 50% 60%, #fff8e8 0%, #ffd9a0 25%, #ffb465 50%, #ff9c3d 75%, transparent 100%);
  filter: blur(0.8px); transition: all 0.6s ease; animation: ember-core 2.5s ease-in-out infinite;
}
@keyframes ember-breathe { 0%,100%{transform:translateX(-50%) scale(1)} 50%{transform:translateX(-50%) scale(1.08)} }
@keyframes ember-pulse { 0%,100%{transform:translateX(-50%) scale(1);opacity:0.5} 50%{transform:translateX(-50%) scale(1.15);opacity:0.7} }
@keyframes ember-core { 0%,100%{transform:translate(-50%,0) scale(1) scaleX(1)} 33%{transform:translate(-50%,-1px) scale(1.08) scaleX(0.92)} 66%{transform:translate(-50%,0.5px) scale(0.95) scaleX(1.06)} }
@keyframes spark-rise { 0%{opacity:0;transform:translateY(0) translateX(0) scale(0.5)} 15%{opacity:0.65} 100%{opacity:0;transform:translateY(-55px) translateX(var(--drift)) scale(0.25)} }

/* Buttons */
.btn {
  padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px;
  font-family: var(--fb); font-weight: 600;
}
.btn-primary {
  background: linear-gradient(180deg, #ffd9a8, #ffb465 60%, #ff9c3d);
  color: #1a1006; box-shadow: 0 4px 12px rgba(255,156,61,0.25);
}
.btn-ghost { background: rgba(255,255,255,0.06); color: var(--fg); }
.controls { display: flex; justify-content: center; gap: 10px; padding: 2px 0; height: 44px; align-items: center; }
.today-sum { text-align: center; color: #4a5360; font-size: 12px; font-family: var(--fd); height: 20px; line-height: 20px; }

/* Today list */
.today-list { padding: 12px; overflow: auto; max-height: 120px; }
.today-item { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; color: #6e7a88; }
.today-item .task { color: #8a94a0; }

/* Section label */
.slabel { color: var(--muted); font-size: 11px; letter-spacing: 0.12em; font-family: var(--fd); margin-bottom: 8px; }
.slabel-sm { font-size: 10px; margin-bottom: 6px; }

/* Logs view */
.log-date { color: #8a94a0; font-size: 12px; font-family: var(--fd); letter-spacing: 0.08em; }
.log-total { color: var(--warm); font-size: 12px; font-family: var(--fb); }
.log-entry { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
.log-task { color: #a0aab4; }
.log-time { color: #4a5360; margin-left: 10px; font-size: 11px; }
.log-dur { color: #6e7a88; font-variant-numeric: tabular-nums; }
.del-btn { background: none; border: none; color: #2a3038; cursor: pointer; font-size: 13px; }

/* Stats */
.stat-card { text-align: center; }
.stat-label { color: var(--muted); font-size: 10px; font-family: var(--fd); letter-spacing: 0.1em; }
.stat-value { font-size: 18px; font-family: var(--fd); font-weight: 600; margin-top: 4px; }
.bar-bg { height: 4px; background: rgba(255,255,255,0.04); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #ff9c3d, #ffc470); transition: width 0.3s; }

/* Settings tag */
.settings-tag {
  padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px;
  font-family: var(--fb); transition: all 0.15s;
}
.settings-tag.on { background: rgba(255,176,80,0.15); color: var(--warm); }
.settings-tag.off { background: rgba(255,255,255,0.04); color: #8a94a0; }
.pomo-input {
  width: 60px; text-align: center; padding: 9px 12px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
  color: var(--fg); font-size: 13px; font-family: var(--fb); outline: none;
}

/* Empty state */
.empty { text-align: center; color: var(--dim); font-family: var(--fd); padding: 40px; }

/* Tab content */
.tab-content { display: none; flex-direction: column; gap: 12px; flex: 1; overflow: auto; }
.tab-content.active { display: flex; }

/* Scroll */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="clock" id="clock"></div>
    <div class="nav">
      <button class="nav-btn active" data-tab="timer">灯</button>
      <button class="nav-btn" data-tab="logs">記録</button>
      <button class="nav-btn" data-tab="stats">統計</button>
      <button class="nav-btn" data-tab="settings">設定</button>
    </div>
  </div>

  <div class="main">
    <!-- Timer Tab -->
    <div class="tab-content active" id="tab-timer">
      <div class="timer-grid">
        <div class="card counter-panel">
          <div class="counter" id="counter">00:00:00</div>
          <div class="remain-row" id="remain">&nbsp;</div>
        </div>

        <div class="card task-panel" id="taskPanel"></div>

        <div class="card msg-panel">
          <div class="ember-wrap" id="ember"></div>
          <div class="msg-text" id="bubble"></div>
          <div class="msg-fade"></div>
        </div>

        <div class="controls" id="controls"></div>
        <div class="today-sum" id="todaySum"></div>
        <div id="todayList"></div>
      </div>
    </div>

    <!-- Logs Tab -->
    <div class="tab-content" id="tab-logs"></div>

    <!-- Stats Tab -->
    <div class="tab-content" id="tab-stats"></div>

    <!-- Settings Tab -->
    <div class="tab-content" id="tab-settings"></div>
  </div>

  <div class="footer">── 同座 ──</div>
</div>

<script>
/* ===== Helpers ===== */
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const pad = (n) => String(n).padStart(2, "0");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtHM = (iso) => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDur = (ms) => { const s = Math.max(0, Math.floor(ms/1000)); return `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`; };
const fmtShort = (ms) => { const m = Math.round(ms/60000); const h = Math.floor(m/60); const mm = m%60; return h > 0 ? `${h}時間${pad(mm)}分` : `${mm}分`; };

/* ===== Storage ===== */
const KEYS = { logs: "doza.logs.v2", tasks: "doza.tasks.v2", settings: "doza.settings.v2" };
function loadData(key, fb) { try { return JSON.parse(localStorage.getItem(key)) || fb; } catch { return fb; } }
function saveData(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

let logs = loadData(KEYS.logs, []);
let savedTasks = loadData(KEYS.tasks, []);
let settings = loadData(KEYS.settings, { pomoMin: 25, pomoEnabled: false });

/* ===== Messages ===== */
const MSG = {
  start: ["……さて、始めようか。","私が傍にいる。任せろ。","まずは三分。集中しろ。","よし、火を入れよう。","始めるか。今日の一手目だ。"],
  random: ["水をひと口。頭の熱を冷ませ。","いい流れだ。静かに続けよう。","姿勢を直せ。肩を軽く引き、首を解せ。","……ここは静かでいいな。","思考が絡んだら、作業を箇条書きに落とせ。","余計な完璧を捨てろ。粗く、早く、後で直す。","よく耐えている。","……静かだな。悪くない。","集中の途切れは自然なことだ。戻ればいい。","小さな区切りを作れ。それが継続の鍵だ。","完璧を狙うな。まずは粗く整えよ。","今やるべきことだけを見ろ。枝葉は後で払え。","五分だけ続けてみろ。それで変わることもある。","疲れたなら、姿勢を変えろ。血が巡れば思考も回る。","作業を小さく区切れ。区切りが見えるだけで動ける。","判断は後でいい。今は材料を並べる段だ。","雑でもいい。空白のままより百倍ましだ。","気乗りしなくても、やっている自分を褒めておけ。","進捗が遅くても構わぬ。動き続けているなら、それで良い。","今日の出来は問わぬ。続けた事実だけが力となる。","結果ではなく流れを作れ。今日の勝ちはそこだ。","面倒と感じる作業ほど、後の助けになる。","無理にでも続けると、ある瞬間、霧が晴れる。"],
  chime: ["刻の報せだ。ここで区切ってもいい。","一刻が過ぎた。手を止めて振り返れ。","……もうこんな時刻か。","よくここまで持ったな。","一刻だ。区切るか、続けるか。"],
  pause: ["休むのも技だ。体勢を整えろ。","少し休め。張りつめた糸は切れやすい。","水でも飲んでこい。","中断もまた策のうちだ。","……ふむ。茶でも淹れるか。","少し手を休めるのも悪くない。","肩を回せ。固まったままでは考えも鈍る。","外の空気を吸ってこい。五分でいい。","焦っても仕方がない。火を絶やさなければ良いだけだ。","一息ついたら、また戻ればいい。それだけのことだ。"],
  resume: ["戻ったか。……よし、続けよう。","席に戻れたな。十分だ。","続きをやる気になったか、良い兆しだ。","さあ、もう一度始めるぞ。","さて……灯が再び揺れ始めたぞ。","戻ったか。気分は整ったか。","休むのは悪くない。戻ってきたなら上出来だ。","待っていた。次の手を見せてもらおうか。","気持ちが鈍る前に、また火を入れよう。"],
  end: ["一区切りだ。よく持った。","灯を落とそう。続きはまただ。","今日の働き、悪くない。","ここで止めるのも英断だ。","……よくやった。","灯を絶やすな。明日も続きがある。"],
  pomoEnd: ["鐘が鳴った。ここで区切ろう。","予定の刻限だ。よく集中した。"],
  idle: ["……準備が整い次第、始めよう。","火はいつでも入れられる。","さて、今日は何をやるか。"],
};

/* ===== Sound: Pentatonic ===== */
const PENTA_HI = [1047, 1175, 1319, 1568, 1760];
const PENTA_LO = [523, 587, 659, 784, 880];
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const b = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
    const s = audioCtx.createBufferSource(); s.buffer = b;
    s.connect(audioCtx.destination); s.start(0);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function playBell() {
  try {
    const ctx = getAudioCtx(), t = ctx.currentTime, freq = pick(PENTA_HI);
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.05, t + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 1.5);
    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
  } catch {}
}

function playEndBell() {
  try {
    const ctx = getAudioCtx(), t = ctx.currentTime, freq = pick(PENTA_LO);
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.1, t + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 3.0);
    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
  } catch {}
}

/* ===== Typewriter ===== */
let typing = false, typeQueue = [], typeTimer = null;
const bubbleEl = $("#bubble");

function say(text) {
  if (typing) { typeQueue.push(text); setEmberBoost(true); return; }
  typing = true; setEmberBoost(true); playBell();
  bubbleEl.innerHTML = ""; let i = 0;
  function tick() {
    if (i < text.length) {
      bubbleEl.textContent = text.slice(0, i + 1);
      // Add cursor
      const cur = document.createElement("span");
      cur.className = "msg-cursor"; cur.textContent = "｜";
      bubbleEl.appendChild(cur);
      i++;
      typeTimer = setTimeout(tick, 50);
    } else {
      // Remove cursor
      const cur = bubbleEl.querySelector(".msg-cursor");
      if (cur) cur.remove();
      typing = false; setEmberBoost(false);
      if (typeQueue.length > 0) {
        typeTimer = setTimeout(() => say(typeQueue.shift()), 600);
      }
    }
  }
  typeTimer = setTimeout(tick, 50);
}

/* ===== Ember ===== */
function initEmber() {
  const wrap = $("#ember");
  const sparkData = [
    { left: 22, bottom: 30, size: 2.4, dur: 5, delay: 0, drift: 12 },
    { left: 32, bottom: 32, size: 2.28, dur: 5.9, delay: 0.85, drift: -19 },
    { left: 19, bottom: 34, size: 2.16, dur: 6.8, delay: 1.7, drift: 26 },
    { left: 28, bottom: 36, size: 2.04, dur: 7.7, delay: 2.55, drift: -33 },
    { left: 24, bottom: 38, size: 1.92, dur: 8.6, delay: 3.4, drift: 40 },
    { left: 30, bottom: 40, size: 1.8, dur: 9.5, delay: 4.25, drift: -47 },
  ];
  let html = "";
  sparkData.forEach(sp => {
    html += `<div class="spark" style="left:${sp.left}px;bottom:${sp.bottom}px;width:${sp.size}px;height:${sp.size}px;animation:spark-rise ${sp.dur}s ease-out infinite;animation-delay:${sp.delay}s;--drift:${sp.drift}px"></div>`;
  });
  html += `<div class="ember-outer" id="eOuter" style="width:36px;height:36px;opacity:0.2"></div>`;
  html += `<div class="ember-mid" id="eMid" style="width:14px;height:14px;opacity:0.12"></div>`;
  html += `<div class="ember-core" id="eCore" style="width:4.5px;height:7px;opacity:0.35"></div>`;
  wrap.innerHTML = html;
}

function setEmberBoost(boost) {
  const active = timerState === "running" || timerState === "paused";
  const eO = $("#eOuter"), eM = $("#eMid"), eC = $("#eCore");
  if (!eO) return;
  eO.style.width = (boost ? 48 : 36) + "px"; eO.style.height = (boost ? 48 : 36) + "px";
  eO.style.opacity = active ? (boost ? 0.9 : 0.55) : 0.2;
  eM.style.width = (boost ? 20 : 14) + "px"; eM.style.height = (boost ? 20 : 14) + "px";
  eM.style.opacity = active ? (boost ? 0.8 : 0.5) : 0.12;
  eC.style.width = (boost ? 7 : 4.5) + "px"; eC.style.height = (boost ? 10 : 7) + "px";
  eC.style.opacity = active ? 1 : 0.35;
  eC.style.boxShadow = boost
    ? "0 0 12px rgba(255,200,120,0.5), 0 0 24px rgba(255,156,61,0.3), 0 -4px 8px rgba(255,220,160,0.2)"
    : "0 0 8px rgba(255,200,120,0.25), 0 0 14px rgba(255,156,61,0.12)";
  // Sparks animation
  $$(".spark").forEach(s => { s.style.animationPlayState = active ? "running" : "paused"; });
}

function updateEmberState() { setEmberBoost(false); }

/* ===== Timer State ===== */
let timerState = "idle"; // idle | running | paused
let taskName = "";
let startIso = null;
let pausedMs = 0;
let pauseStartIso = null;
let elapsed = 0;
let tickId = null, randomId = null, chimeId = null, followUpId = null;

/* ===== Clock ===== */
setInterval(() => {
  const d = new Date();
  $("#clock").textContent = `${d.getMonth()+1}月${pad(d.getDate())}日 ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}, 1000);

/* ===== Tabs ===== */
$$(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    $$(".nav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    $$(".tab-content").forEach(t => t.classList.remove("active"));
    $(`#tab-${btn.dataset.tab}`).classList.add("active");
    if (btn.dataset.tab === "logs") renderLogs();
    if (btn.dataset.tab === "stats") renderStats();
    if (btn.dataset.tab === "settings") renderSettings();
  });
});

/* ===== Task Management ===== */
function saveTask(name) {
  if (name && !savedTasks.includes(name)) {
    savedTasks.push(name);
    saveData(KEYS.tasks, savedTasks);
  }
}

function removeTask(name) {
  savedTasks = savedTasks.filter(t => t !== name);
  saveData(KEYS.tasks, savedTasks);
  renderTaskPanel();
}

/* ===== Render: Task Panel ===== */
function renderTaskPanel() {
  const el = $("#taskPanel");
  if (timerState === "idle") {
    let html = '<div class="task-tags">';
    savedTasks.forEach(t => {
      html += `<div style="display:inline-flex;align-items:center"><button class="task-tag" data-start="${t}">${t}</button><button class="task-tag-del" data-remove="${t}">×</button></div>`;
    });
    html += '</div>';
    html += `<input class="task-input" id="taskInput" placeholder="作業名を入力" value="${taskName}">`;
    el.innerHTML = html;

    // Events
    el.querySelectorAll("[data-start]").forEach(b => {
      b.addEventListener("click", () => { taskName = b.dataset.start; startSession(); });
    });
    el.querySelectorAll("[data-remove]").forEach(b => {
      b.addEventListener("click", (e) => { e.stopPropagation(); removeTask(b.dataset.remove); });
    });
    const inp = $("#taskInput");
    inp.addEventListener("input", () => { taskName = inp.value; });
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && taskName.trim()) startSession(); });
  } else {
    let html = '<div class="task-running">';
    html += `<div class="label">作業</div>`;
    html += `<div class="name">${taskName || "未設定"}</div>`;
    if (startIso) html += `<div class="time">${fmtHM(startIso)} 開始</div>`;
    html += '</div>';
    el.innerHTML = html;
  }
}

/* ===== Render: Controls ===== */
function renderControls() {
  const el = $("#controls");
  if (timerState === "idle") {
    el.innerHTML = `<button class="btn btn-primary" id="btnStart">開始</button>`;
    $("#btnStart").addEventListener("click", startSession);
  } else if (timerState === "running") {
    el.innerHTML = `<button class="btn btn-ghost" id="btnPause">一時停止</button><button class="btn btn-ghost" id="btnStop">終了</button>`;
    $("#btnPause").addEventListener("click", pauseSession);
    $("#btnStop").addEventListener("click", () => stopSession(false));
  } else {
    el.innerHTML = `<button class="btn btn-primary" id="btnResume">再開</button><button class="btn btn-ghost" id="btnStop">終了</button>`;
    $("#btnResume").addEventListener("click", resumeSession);
    $("#btnStop").addEventListener("click", () => stopSession(false));
  }
}

/* ===== Render: Today ===== */
function renderToday() {
  const tl = logs.filter(l => l.date === todayStr());
  const total = tl.reduce((s, l) => s + l.ms, 0);
  const count = tl.length;
  $("#todaySum").textContent = `本日の合計：${fmtShort(total)}` + (count > 0 ? `（${count}件）` : "");

  const el = $("#todayList");
  if (tl.length === 0) { el.innerHTML = ""; return; }
  let html = '<div class="card today-list"><div class="slabel slabel-sm">▸ 本日の作業</div>';
  tl.forEach(l => {
    html += `<div class="today-item"><span class="task">${l.task}</span><span style="font-variant-numeric:tabular-nums">${l.startHM}–${l.endHM}（${fmtShort(l.ms)}）</span></div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

/* ===== Counter Update ===== */
function updateCounter() {
  const el = $("#counter");
  el.textContent = fmtDur(elapsed);
  el.className = "counter" + (timerState === "running" ? " running" : timerState === "paused" ? " paused" : "");

  const rem = $("#remain");
  if (settings.pomoEnabled && settings.pomoMin > 0 && timerState === "running") {
    const left = Math.max(0, settings.pomoMin * 60 * 1000 - elapsed);
    rem.textContent = `残り ${fmtDur(left)}`;
    rem.className = "remain-row" + (left < 60000 ? " urgent" : "");
  } else {
    rem.innerHTML = "&nbsp;";
    rem.className = "remain-row";
  }
}

/* ===== Follow-up (event → 5-10s → random) ===== */
function scheduleFollowUp() {
  clearTimeout(followUpId);
  const delay = 5000 + Math.random() * 5000;
  followUpId = setTimeout(() => {
    if (timerState === "running") say(pick(MSG.random));
  }, delay);
}

/* ===== Random Talk (3-10 min) ===== */
function scheduleRandom() {
  clearTimeout(randomId);
  const gap = (3 + Math.random() * 7) * 60 * 1000;
  randomId = setTimeout(() => {
    if (timerState === "running") { say(pick(MSG.random)); scheduleRandom(); }
  }, gap);
}

function startRandomCycle() {
  clearTimeout(randomId);
  const init = 60000 + Math.random() * 60000;
  randomId = setTimeout(() => {
    if (timerState === "running") { say(pick(MSG.random)); scheduleRandom(); }
  }, init);
}

/* ===== Chime (hourly) ===== */
function scheduleChime() {
  clearTimeout(chimeId);
  const n = new Date();
  const next = new Date(n.getFullYear(), n.getMonth(), n.getDate(), n.getHours() + 1, 0, 0);
  chimeId = setTimeout(() => {
    if (timerState === "running") { say(pick(MSG.chime)); scheduleFollowUp(); }
    scheduleChime();
  }, next - n);
}

/* ===== Session ===== */
function startSession() {
  try { getAudioCtx(); } catch {}
  const inp = $("#taskInput");
  if (inp) taskName = inp.value.trim() || taskName;
  if (!taskName) taskName = "未設定";

  // Save task name at start
  saveTask(taskName);

  startIso = new Date().toISOString();
  pausedMs = 0; pauseStartIso = null; elapsed = 0;
  timerState = "running";

  renderTaskPanel(); renderControls(); updateCounter(); updateEmberState();

  // Tick
  clearInterval(tickId);
  tickId = setInterval(() => {
    if (timerState === "running" && startIso) {
      elapsed = Date.now() - new Date(startIso).getTime() - pausedMs;
      updateCounter();
      if (settings.pomoEnabled && settings.pomoMin > 0 && elapsed >= settings.pomoMin * 60 * 1000) {
        stopSession(true);
      }
    }
  }, 1000);

  say(pick(MSG.start));
  scheduleFollowUp();
  startRandomCycle();
  scheduleChime();
}

function pauseSession() {
  if (timerState !== "running") return;
  pauseStartIso = new Date().toISOString();
  timerState = "paused";
  clearInterval(tickId); clearTimeout(randomId); clearTimeout(chimeId); clearTimeout(followUpId);
  renderControls(); updateEmberState();
  say(pick(MSG.pause));
}

function resumeSession() {
  if (timerState !== "paused") return;
  if (pauseStartIso) pausedMs += Date.now() - new Date(pauseStartIso).getTime();
  pauseStartIso = null;
  timerState = "running";

  clearInterval(tickId);
  tickId = setInterval(() => {
    if (timerState === "running" && startIso) {
      elapsed = Date.now() - new Date(startIso).getTime() - pausedMs;
      updateCounter();
      if (settings.pomoEnabled && settings.pomoMin > 0 && elapsed >= settings.pomoMin * 60 * 1000) {
        stopSession(true);
      }
    }
  }, 1000);

  renderControls(); updateEmberState();
  say(pick(MSG.resume));
  scheduleFollowUp();
  startRandomCycle();
  scheduleChime();
}

function stopSession(byPomo) {
  if (timerState === "idle") return;
  clearInterval(tickId); clearTimeout(randomId); clearTimeout(chimeId); clearTimeout(followUpId);

  let fp = pausedMs;
  if (pauseStartIso) fp += Date.now() - new Date(pauseStartIso).getTime();
  const end = new Date();
  const ms = startIso ? end.getTime() - new Date(startIso).getTime() - fp : 0;

  if (ms > 5000) {
    logs.push({
      id: uid(), date: todayStr(), task: taskName || "未設定",
      startIso, endIso: end.toISOString(),
      startHM: fmtHM(startIso), endHM: fmtHM(end.toISOString()), ms
    });
    saveData(KEYS.logs, logs);
  }

  timerState = "idle"; startIso = null; pausedMs = 0; pauseStartIso = null; elapsed = 0;
  renderTaskPanel(); renderControls(); updateCounter(); renderToday(); updateEmberState();
  playEndBell();
  say(byPomo ? pick(MSG.pomoEnd) : pick(MSG.end));
}

/* ===== Render: Logs Tab ===== */
function renderLogs() {
  const el = $("#tab-logs");
  if (logs.length === 0) { el.innerHTML = '<div class="card empty">まだ記録がない。</div>'; return; }

  const byDate = {};
  logs.forEach(l => { if (!byDate[l.date]) byDate[l.date] = []; byDate[l.date].push(l); });
  const dates = Object.keys(byDate).sort().reverse();

  let html = "";
  dates.forEach(date => {
    const dl = byDate[date]; const dt = dl.reduce((s, l) => s + l.ms, 0);
    html += `<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><div class="log-date">${date}</div><div class="log-total">${fmtShort(dt)}</div></div>`;
    dl.forEach(l => {
      html += `<div class="log-entry"><div style="flex:1"><span class="log-task">${l.task}</span><span class="log-time">${l.startHM}–${l.endHM}</span></div><div style="display:flex;align-items:center;gap:10px"><span class="log-dur">${fmtShort(l.ms)}</span><button class="del-btn" data-del="${l.id}">×</button></div></div>`;
    });
    html += '</div>';
  });
  html += `<div style="display:flex;justify-content:center;padding:8px"><button class="btn btn-ghost" id="clearAllLogs" style="font-size:11px;padding:6px 14px;color:#5a6370">ログ全削除</button></div>`;
  el.innerHTML = html;

  el.querySelectorAll("[data-del]").forEach(b => {
    b.addEventListener("click", () => {
      logs = logs.filter(l => l.id !== b.dataset.del);
      saveData(KEYS.logs, logs); renderLogs(); renderToday();
    });
  });
  const clearBtn = $("#clearAllLogs");
  if (clearBtn) clearBtn.addEventListener("click", () => {
    if (confirm("すべての作業ログを削除する。よいな？")) {
      logs = []; saveData(KEYS.logs, logs); renderLogs(); renderToday();
    }
  });
}

/* ===== Render: Stats Tab ===== */
function renderStats() {
  const el = $("#tab-stats");
  const ta = logs.reduce((s, l) => s + l.ms, 0);
  const dw = new Set(logs.map(l => l.date)).size;

  const taskT = {};
  logs.forEach(l => { if (!taskT[l.task]) taskT[l.task] = { ms: 0, count: 0 }; taskT[l.task].ms += l.ms; taskT[l.task].count++; });
  const sorted = Object.entries(taskT).sort((a, b) => b[1].ms - a[1].ms);

  let html = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
  html += `<div class="card stat-card"><div class="stat-label">総作業時間</div><div class="stat-value" style="color:var(--warm)">${fmtShort(ta)}</div></div>`;
  html += `<div class="card stat-card"><div class="stat-label">作業日数</div><div class="stat-value" style="color:#a0aab4">${dw}日</div></div>`;
  html += `</div>`;

  html += `<div class="card"><div class="slabel">▸ 作業別の累積</div>`;
  if (sorted.length === 0) { html += '<div style="color:#3a4048;font-size:13px">データなし</div>'; }
  else {
    sorted.forEach(([task, data]) => {
      const pct = ta > 0 ? (data.ms / ta) * 100 : 0;
      html += `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="color:#a0aab4">${task}</span><span style="color:#6e7a88">${fmtShort(data.ms)}<span style="color:#4a5360;margin-left:6px;font-size:11px">(${data.count}回)</span></span></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div></div>`;
    });
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ===== Render: Settings Tab ===== */
function renderSettings() {
  const el = $("#tab-settings");
  let html = `<div class="card"><div class="slabel">▸ ポモドーロ</div><div style="display:flex;align-items:center;gap:12px">`;
  html += `<button class="settings-tag ${settings.pomoEnabled ? 'on' : 'off'}" id="pomoToggle">${settings.pomoEnabled ? '有効' : '無効'}</button>`;
  if (settings.pomoEnabled) {
    html += `<div style="display:flex;align-items:center;gap:6px"><input type="number" class="pomo-input" id="pomoMinInput" min="1" max="120" value="${settings.pomoMin}"><span style="color:#5a6370;font-size:12px">分</span></div>`;
  }
  html += `</div></div>`;

  html += `<div class="card"><div class="slabel">▸ 保存済み作業名</div>`;
  if (savedTasks.length === 0) { html += '<div style="color:#3a4048;font-size:13px">作業を開始すると自動保存される</div>'; }
  else {
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
    savedTasks.forEach(t => {
      html += `<div style="display:inline-flex;align-items:center;gap:2px"><span class="settings-tag off" style="cursor:default">${t}</span><button class="del-btn" data-removetask="${t}">×</button></div>`;
    });
    html += '</div>';
  }
  html += '</div>';

  html += `<div class="card"><div class="slabel">▸ 声かけの種類</div><div style="font-size:12px;color:#5a6370;line-height:1.8">開始 → 追い打ち / 作業中（3〜10分） / 正時の鐘 → 追い打ち / 一時停止 / 再開 → 追い打ち / 終了</div></div>`;
  el.innerHTML = html;

  $("#pomoToggle").addEventListener("click", () => {
    settings.pomoEnabled = !settings.pomoEnabled;
    saveData(KEYS.settings, settings); renderSettings();
  });
  const pInput = $("#pomoMinInput");
  if (pInput) pInput.addEventListener("change", () => {
    settings.pomoMin = Math.max(1, Math.min(120, parseInt(pInput.value) || 25));
    saveData(KEYS.settings, settings);
  });
  el.querySelectorAll("[data-removetask]").forEach(b => {
    b.addEventListener("click", () => { removeTask(b.dataset.removetask); renderSettings(); });
  });
}

/* ===== Init ===== */
initEmber();
renderTaskPanel();
renderControls();
updateCounter();
renderToday();
say(pick(MSG.idle));

/* ===== PWA: Service Worker ===== */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js", { scope: "./" }).catch(() => {});
  });
}
</script>
</body>
</html>
